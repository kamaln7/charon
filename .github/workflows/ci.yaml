name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The Go tests never parse the frontend, so a syntax error in app.js
      # would otherwise ship and only surface as a blank page.
      - run: node --check web/app.js && node --check web/theme.js
